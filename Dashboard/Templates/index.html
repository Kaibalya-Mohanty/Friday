<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>F.R.I.D.A.Y.</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>

<body>

    <div class="header">
        <h1>F.R.I.D.A.Y.</h1>
        <div class="status-badge">
            <div class="status-dot"></div>
            ONLINE
        </div>
    </div>

    <div class="grid-3">

        <div class="card">
            <h2>Current Time</h2>
            <div class="time-display" id="clock">--:--</div>
            <div class="date-display" id="date-display">Loading...</div>
        </div>

        <div class="card">
            <h2>Last Activity</h2>
            <div class="last-query" id="last-query">Waiting for command...</div>
            <div class="last-agent">
                Handled by: <span class="agent-tag" id="last-agent-tag">—</span>
            </div>
        </div>

        <div class="card">
            <h2>System</h2>
            <div class="stat-row">
                <span class="stat-label">CPU</span>
                <span class="stat-value" id="cpu-val">—</span>
                <div class="stat-bar-wrap">
                    <div class="stat-bar" id="cpu-bar"></div>
                </div>
            </div>
            <div class="stat-row">
                <span class="stat-label">RAM</span>
                <span class="stat-value" id="ram-val">—</span>
                <div class="stat-bar-wrap">
                    <div class="stat-bar" id="ram-bar"></div>
                </div>
            </div>
            <div class="stat-row">
                <span class="stat-label">Battery</span>
                <span class="stat-value" id="bat-val">—</span>
                <div class="stat-bar-wrap">
                    <div class="stat-bar" id="bat-bar"></div>
                </div>
            </div>
            <div class="stat-row">
                <span class="stat-label">Disk</span>
                <span class="stat-value" id="disk-val">—</span>
                <div class="stat-bar-wrap">
                    <div class="stat-bar" id="disk-bar"></div>
                </div>
            </div>
        </div>

    </div>

    <div class="card">
        <h2>Conversation History</h2>
        <div class="conv-list" id="conv-list">
            <div class="empty-msg">No conversations yet. Say "Jarvis" to begin.</div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>

</html>
